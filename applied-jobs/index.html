<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Applied Jobs | Kawsar Bin Siraj</title>
        <script src="https://cdn.tailwindcss.com"></script>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet" />
        <style>
            body { font-family: "Google Sans", system-ui, sans-serif; }
            /* SL auto-numbers each row */
            tbody { counter-reset: sl; }
            tbody tr { counter-increment: sl; }
            .sl::before { content: counter(sl); }
        </style>
    </head>

    <body class="bg-gray-100 text-gray-800 text-[14px] p-5">
        <main class="max-w-5xl mx-auto">
            <a href="../index.html" class="inline-flex items-center gap-1 text-[13px] text-gray-500 hover:text-blue-700 mb-4">&larr; Back to home</a>
            <header class="mb-5">
                <p class="text-[12px] font-semibold uppercase tracking-widest text-blue-700">Job Tracker</p>
                <h1 class="text-2xl font-bold text-gray-900 mt-1">Applied Jobs</h1>
                <p class="text-[13px] text-gray-500 mt-1">Every application, its status, and the salary I asked for.</p>
            </header>

            <div class="bg-white rounded-lg border border-gray-200 overflow-x-auto">
                <table class="w-full text-left text-[13px]">
                    <thead class="bg-gray-50 text-[12px] uppercase tracking-wide text-gray-500">
                        <tr>
                            <th class="px-3 py-2 font-semibold w-10">SL</th>
                            <th class="px-3 py-2 font-semibold">Company</th>
                            <th class="px-3 py-2 font-semibold">Job Type</th>
                            <th class="px-3 py-2 font-semibold">Application Date</th>
                            <th class="px-3 py-2 font-semibold">Interview Call</th>
                            <th class="px-3 py-2 font-semibold text-right">Details</th>
                        </tr>
                    </thead>
                    <tbody class="divide-y divide-gray-100">
                        <!--
                            Add one <tr> per application.
                            Interview Call badges:
                              Yes     -> bg-green-100 text-green-700
                              No      -> bg-red-100 text-red-700
                              Pending -> bg-yellow-100 text-yellow-700
                            Details link: jobs/<company>_<designation>_<YYYY-MM-DD>.md
                        -->
                        <tr class="hover:bg-gray-50">
                            <td class="px-3 py-2 sl text-gray-500"></td>
                            <td class="px-3 py-2">
                                <div class="font-medium">Example Corp</div>
                                <div class="text-[12px] text-gray-500">Senior Frontend Developer</div>
                            </td>
                            <td class="px-3 py-2">Full-time &middot; Remote</td>
                            <td class="px-3 py-2 whitespace-nowrap">27 Nov 2026</td>
                            <td class="px-3 py-2">
                                <span class="inline-block rounded-full px-2 py-0.5 text-[12px] font-medium bg-yellow-100 text-yellow-700">Pending</span>
                            </td>
                            <td class="px-3 py-2 text-right">
                                <a href="jobs/example-corp_senior-frontend-developer_2026-11-27.md" target="_blank" class="inline-flex items-center gap-1 rounded-md border border-gray-300 px-2 py-0.5 text-[12px] font-medium hover:bg-gray-100"><svg xmlns="http://www.w3.org/2000/svg" class="size-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" aria-hidden="true"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 12s3.75-7.5 9.75-7.5 9.75 7.5 9.75 7.5-3.75 7.5-9.75 7.5S2.25 12 2.25 12z" /><circle cx="12" cy="12" r="3" /></svg>View</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </body>
</html>
